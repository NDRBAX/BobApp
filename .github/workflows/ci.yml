name: CI Build and Test

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
        fetch-depth: 0 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven- 

      - name: Build and test backend
        run: ./mvnw clean install
        working-directory: ./back

      - name: Test Report (JUnit)
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: 'JUnit Tests (Backend)'
          path: back/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          only-summary: 'false'

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: back/target/site/jacoco/

      # - name: Analyse SonarCloud
      #   run: ./mvnw sonar:sonar -Dsonar.projectKey=ndrbax_BobApp_Back -Dsonar.organization=ndrbax -Dsonar.host.url=https://sonarcloud.io
      #   working-directory: ./back
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ndrbax_BobApp_Back

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
        fetch-depth: 0 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ./front

      - name: Install Chrome
        run: |
          if ! command -v google-chrome; then
            sudo apt-get update
            sudo apt-get install -y wget
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt install -y ./google-chrome-stable_current_amd64.deb
          fi

      - name: Build Frontend
        run: npm run build
        working-directory: ./front

      - name: Test Frontend
        run: npm run test:prod
        working-directory: ./front

      - name: Test Report (Karma/JUnit)
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: 'Karma Tests (Frontend)'
          path: front/coverage/junit.xml
          reporter: java-junit

      - name: Upload Frontend Coverage
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage/bobapp/
        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

